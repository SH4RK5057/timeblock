<!doctype html>
<html><head><meta charset="utf-8"><title>Timeblock</title>
<style>
  body { width: 280px; margin: 0; padding: 14px; font: 14px system-ui, sans-serif; color: #1b2330; }
  @media (prefers-color-scheme: dark) { body { background: #12161d; color: #e6eaf0; } input { background: #1a202a; color: inherit; border-color: #262d3a; } }
  h2 { margin: 0 0 4px; font-size: 18px; } .muted { color: #6b7686; font-size: 13px; }
  input, button { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 8px; border-radius: 6px; border: 1px solid #c9d0db; font: inherit; }
  button { cursor: pointer; background: #2f5bea; color: #fff; border-color: #2f5bea; }
  button.end { background: #d33c3c; border-color: #d33c3c; } button.link { background: none; color: #2f5bea; border: none; }
  .err { color: #d33c3c; font-size: 13px; }
</style></head>
