<!doctype html>
<html><head><meta charset="utf-8"><title>Blocked · Timeblock</title>
<style>
  body { font: 16px system-ui, sans-serif; background: #12161d; color: #e6eaf0; display: grid; place-items: center; min-height: 100vh; margin: 0; }
  main { max-width: 520px; padding: 24px; }
  h1 { margin: 0 0 6px; } .muted { color: #8b95a5; } pre { white-space: pre-wrap; font: inherit; }
  a, button { color: #fff; background: #2f5bea; border: none; border-radius: 8px; padding: 10px 16px; font: inherit; cursor: pointer; text-decoration: none; display: inline-block; margin: 6px 6px 0 0; }
  button.ghost { background: none; border: 1px solid #3a4558; }
  code { display: block; font-size: 20px; letter-spacing: 1px; background: #1a202a; padding: 12px; border-radius: 8px; margin: 10px 0; word-break: break-all; user-select: none; }
  input { width: 100%; box-sizing: border-box; padding: 10px; font: inherit; border-radius: 8px; border: 1px solid #3a4558; background: #1a202a; color: inherit; }
  .err { color: #ff6b6b; }
</style></head>
<body><main id="root"></main><script type="module" src="blocked.js"></script></body></html>
